<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculateur de frais carburant</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 16px;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }

    .secondary {
      background: #6c757d;
    }

    .secondary:hover {
      background: #565e64;
    }

    .info {
      margin-top: 16px;
      padding: 12px;
      background: #eef6ff;
      border-left: 4px solid #0078d4;
      border-radius: 8px;
      font-size: 14px;
    }

    .results {
      margin-top: 24px;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 600px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #0078d4;
      color: white;
    }

    .totaux {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card-total {
      background: #f8f9fa;
      border: 1px solid #e3e6ea;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }

    .card-total .label {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }

    .card-total .value {
      font-size: 22px;
      font-weight: bold;
      color: #0078d4;
    }

    .chart-box {
      margin-top: 24px;
      background: #fff;
      border: 1px solid #e3e6ea;
      border-radius: 12px;
      padding: 16px;
    }

    .chart-title {
      font-weight: bold;
      margin-bottom: 12px;
    }

    canvas {
      width: 100%;
      max-width: 100%;
      height: auto;
      border: 1px solid #eee;
      border-radius: 8px;
      background: #fff;
      display: block;
    }

    .saved {
      margin-top: 12px;
      font-size: 13px;
      color: #2c7a2c;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 16px;
        border-radius: 10px;
      }

      h1 {
        font-size: 22px;
        margin-bottom: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .totaux {
        grid-template-columns: 1fr;
      }

      input, button {
        font-size: 16px;
      }
    }

    @media print {
      .buttons,
      .saved {
        display: none;
      }

      body {
        background: white;
        padding: 0;
      }

      .container {
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Calculateur de frais carburant</h1>

    <div class="grid">
      <div class="full">
        <label for="distance">Distance domicile → travail (km aller simple)</label>
        <input type="number" id="distance" placeholder="Ex : 20" min="0" step="0.1">
      </div>

      <div>
        <label for="conso">Consommation (L / 100 km)</label>
        <input type="number" id="conso" placeholder="Ex : 6.5" min="0" step="0.1">
      </div>

      <div>
        <label for="prix">Prix du litre (€)</label>
        <input type="number" id="prix" placeholder="Ex : 1.80" min="0" step="0.001">
      </div>

      <div class="full buttons">
        <button onclick="calculer()">Calculer</button>
        <button class="secondary" onclick="window.print()">Imprimer</button>
      </div>
    </div>

    <div class="info">
      Le calcul prend en compte un aller-retour du lundi au vendredi.
      Les valeurs sont sauvegardées automatiquement dans le navigateur.
    </div>

    <div class="saved" id="savedMessage"></div>
    <div class="results" id="results"></div>
  </div>

  <script>
    const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi"];

    function sauvegarderValeurs() {
      const donnees = {
        distance: document.getElementById("distance").value,
        conso: document.getElementById("conso").value,
        prix: document.getElementById("prix").value
      };

      localStorage.setItem("fraisCarburant", JSON.stringify(donnees));

      const msg = document.getElementById("savedMessage");
      msg.textContent = "Valeurs enregistrées automatiquement.";
      clearTimeout(window.savedTimeout);
      window.savedTimeout = setTimeout(() => {
        msg.textContent = "";
      }, 2000);
    }

    function chargerValeurs() {
      const saved = localStorage.getItem("fraisCarburant");
      if (!saved) return;

      try {
        const donnees = JSON.parse(saved);
        document.getElementById("distance").value = donnees.distance || "";
        document.getElementById("conso").value = donnees.conso || "";
        document.getElementById("prix").value = donnees.prix || "";
      } catch (e) {
        console.error("Erreur de lecture de la sauvegarde :", e);
      }
    }

    function calculer() {
      const distance = parseFloat(document.getElementById("distance").value);
      const conso = parseFloat(document.getElementById("conso").value);
      const prix = parseFloat(document.getElementById("prix").value);
      const resultDiv = document.getElementById("results");

      if (
        isNaN(distance) || distance <= 0 ||
        isNaN(conso) || conso <= 0 ||
        isNaN(prix) || prix <= 0
      ) {
        resultDiv.innerHTML = "<p style='color:red;'>Merci de renseigner des valeurs valides.</p>";
        return;
      }

      const distanceJour = distance * 2;
      const litresJour = (distanceJour * conso) / 100;
      const coutJour = litresJour * prix;

      const totalSemaine = coutJour * 5;
      const totalMois = totalSemaine * 4;
      const totalAnnee = totalSemaine * 47;

      let html = `
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Jour</th>
                <th>Distance A/R (km)</th>
                <th>Consommation (L)</th>
                <th>Coût (€)</th>
              </tr>
            </thead>
            <tbody>
      `;

      jours.forEach(jour => {
        html += `
          <tr>
            <td>${jour}</td>
            <td>${distanceJour.toFixed(2)}</td>
            <td>${litresJour.toFixed(2)}</td>
            <td>${coutJour.toFixed(2)} €</td>
          </tr>
        `;
      });

      html += `
            </tbody>
          </table>
        </div>

        <div class="totaux">
          <div class="card-total">
            <div class="label">Total semaine</div>
            <div class="value">${totalSemaine.toFixed(2)} €</div>
          </div>
          <div class="card-total">
            <div class="label">Total mois</div>
            <div class="value">${totalMois.toFixed(2)} €</div>
          </div>
          <div class="card-total">
            <div class="label">Total année</div>
            <div class="value">${totalAnnee.toFixed(2)} €</div>
          </div>
        </div>

        <div class="chart-box">
          <div class="chart-title">Graphique des coûts</div>
          <canvas id="costChart" width="800" height="360"></canvas>
        </div>
      `;

      resultDiv.innerHTML = html;

      dessinerGraphique([
        { label: "Jour", value: coutJour },
        { label: "Semaine", value: totalSemaine },
        { label: "Mois", value: totalMois },
        { label: "Année", value: totalAnnee }
      ]);
    }

    function dessinerGraphique(data) {
      const canvas = document.getElementById("costChart");
      const ctx = canvas.getContext("2d");

      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      const marginTop = 30;
      const marginRight = 30;
      const marginBottom = 60;
      const marginLeft = 60;

      const chartWidth = width - marginLeft - marginRight;
      const chartHeight = height - marginTop - marginBottom;

      const maxValue = Math.max(...data.map(item => item.value), 1);
      const steps = 5;

      ctx.font = "12px Arial";
      ctx.fillStyle = "#222";
      ctx.strokeStyle = "#ccc";
      ctx.lineWidth = 1;

      for (let i = 0; i <= steps; i++) {
        const y = marginTop + chartHeight - (i / steps) * chartHeight;
        const value = (maxValue / steps) * i;

        ctx.beginPath();
        ctx.moveTo(marginLeft, y);
        ctx.lineTo(marginLeft + chartWidth, y);
        ctx.strokeStyle = "#e5e5e5";
        ctx.stroke();

        ctx.fillStyle = "#555";
        ctx.textAlign = "right";
        ctx.fillText(value.toFixed(2) + " €", marginLeft - 8, y + 4);
      }

      ctx.beginPath();
      ctx.moveTo(marginLeft, marginTop);
      ctx.lineTo(marginLeft, marginTop + chartHeight);
      ctx.lineTo(marginLeft + chartWidth, marginTop + chartHeight);
      ctx.strokeStyle = "#888";
      ctx.stroke();

      const barCount = data.length;
      const slotWidth = chartWidth / barCount;
      const barWidth = slotWidth * 0.5;

      data.forEach((item, index) => {
        const barHeight = (item.value / maxValue) * chartHeight;
        const x = marginLeft + index * slotWidth + (slotWidth - barWidth) / 2;
        const y = marginTop + chartHeight - barHeight;

        ctx.fillStyle = "#0078d4";
        ctx.fillRect(x, y, barWidth, barHeight);

        ctx.strokeStyle = "#005fa3";
        ctx.strokeRect(x, y, barWidth, barHeight);

        ctx.fillStyle = "#222";
        ctx.textAlign = "center";
        ctx.fillText(item.label, x + barWidth / 2, marginTop + chartHeight + 22);
        ctx.fillText(item.value.toFixed(2) + " €", x + barWidth / 2, y - 8);
      });
    }

    document.getElementById("distance").addEventListener("input", sauvegarderValeurs);
    document.getElementById("conso").addEventListener("input", sauvegarderValeurs);
    document.getElementById("prix").addEventListener("input", sauvegarderValeurs);

    chargerValeurs();
  </script>
</body>
</html>
