<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1F3A">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Revente Billets OM 26/27</title>
<style>
  :root{
    --navy:#0B1F3A;
    --navy2:#122C4F;
    --sky:#2FAEE0;
    --sky-soft:#BFE6F7;
    --gold:#D4A017;
    --white:#F7FAFC;
    --green:#2FBF71;
    --red:#E8554E;
    --line:rgba(191,230,247,.14);
    --radius:14px;
    font-size:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--navy);
    color:var(--white);
    min-height:100vh;
    padding-bottom:90px;
  }
  header{
    background:linear-gradient(160deg,#0B1F3A 0%,#123B63 60%,#16588A 100%);
    padding:20px 16px 14px;
    border-bottom:3px solid var(--sky);
  }
  .brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .brand h1{font-size:1.25rem;font-weight:800;letter-spacing:.5px}
  .brand h1 span{color:var(--sky)}
  .brand small{color:var(--sky-soft);font-weight:600;font-size:.75rem;letter-spacing:1px}
  .devise{font-size:.65rem;color:var(--gold);letter-spacing:2.5px;text-transform:uppercase;margin-top:2px;font-weight:700}

  /* Bilan */
  .bilan{
    margin:14px 16px 0;
    background:var(--navy2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
  }
  .bilan-net{display:flex;justify-content:space-between;align-items:center}
  .bilan-net .label{font-size:.8rem;color:var(--sky-soft);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .bilan-net .value{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--sky-soft)}
  .bilan-detail{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line);
  }
  .bilan-detail div{text-align:center}
  .bilan-detail .k{font-size:.62rem;color:var(--sky-soft);text-transform:uppercase;letter-spacing:.5px}
  .bilan-detail .v{font-size:.95rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .bilan-compet{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
  .bilan-compet .row{display:flex;justify-content:space-between;font-size:.78rem}
  .bilan-compet .row .name{color:var(--sky-soft)}
  .bilan-compet .row .amt{font-weight:700;font-variant-numeric:tabular-nums}

  /* Filtres */
  .filters{display:flex;gap:6px;margin:14px 16px 4px;overflow-x:auto;padding-bottom:4px}
  .filters::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;border:1px solid var(--line);background:transparent;color:var(--sky-soft);
    padding:7px 13px;border-radius:99px;font-size:.75rem;font-weight:700;cursor:pointer;
  }
  .chip.active{background:var(--sky);color:var(--navy);border-color:var(--sky)}

  /* Cartes match */
  #list{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
  .card{
    background:var(--navy2);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;position:relative;overflow:hidden;
  }
  .card.done{border-left:3px solid var(--green)}
  .card.loss{border-left:3px solid var(--red)}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .match-name{font-weight:800;font-size:1rem}
  .match-meta{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}
  .match-date{font-size:.72rem;color:var(--sky-soft)}
  .tag{
    font-size:.6rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
    padding:2px 7px;border-radius:99px;
  }
  .tag.L1{background:rgba(47,174,224,.18);color:var(--sky)}
  .tag.CE{background:rgba(212,160,23,.18);color:var(--gold)}
  .tag.CDF{background:rgba(47,191,113,.18);color:var(--green)}
  .del-btn{
    background:none;border:none;color:var(--sky-soft);font-size:1.1rem;cursor:pointer;
    padding:2px 6px;opacity:.6;line-height:1;
  }
  .card-net{font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums;white-space:nowrap}
  .inputs{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;
  }
  .field label{display:block;font-size:.6rem;color:var(--sky-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:700}
  .field input{
    width:100%;background:var(--navy);border:1px solid var(--line);border-radius:8px;
    color:var(--white);padding:9px 8px;font-size:16px;font-weight:700;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .field input:focus{outline:none;border-color:var(--sky)}
  .field input::placeholder{color:rgba(191,230,247,.3)}

  /* Bouton ajout */
  .fab{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--sky);color:var(--navy);border:none;border-radius:99px;
    padding:14px 26px;font-size:.9rem;font-weight:800;cursor:pointer;
    box-shadow:0 6px 20px rgba(47,174,224,.4);letter-spacing:.3px;
    display:flex;align-items:center;gap:8px;
  }
  .fab span{font-size:1.2rem;line-height:0}

  /* Modal */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(4,12,24,.75);z-index:50;
    align-items:flex-end;justify-content:center;
  }
  .modal-bg.open{display:flex}
  .modal{
    background:var(--navy2);border-radius:20px 20px 0 0;width:100%;max-width:520px;
    padding:20px 18px 28px;border-top:3px solid var(--sky);
  }
  .modal h2{font-size:1.05rem;margin-bottom:14px}
  .modal .field{margin-bottom:12px}
  .modal .field label{font-size:.68rem}
  .modal .field input,.modal .field select{
    width:100%;background:var(--navy);border:1px solid var(--line);border-radius:8px;
    color:var(--white);padding:11px 10px;font-size:16px;font-weight:600;text-align:left;
  }
  .modal-actions{display:flex;gap:10px;margin-top:16px}
  .modal-actions button{
    flex:1;padding:13px;border-radius:10px;font-size:.9rem;font-weight:800;cursor:pointer;border:none;
  }
  .btn-cancel{background:transparent;color:var(--sky-soft);border:1px solid var(--line)!important}
  .btn-ok{background:var(--sky);color:var(--navy)}
  .hint{font-size:.68rem;color:var(--sky-soft);opacity:.7;margin-top:6px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>REVENTE <span>BILLETS</span></h1>
    <small>OM · SAISON 2026-2027 · VÉLODROME</small>
  </div>
  <div class="devise">Droit au but</div>
</header>

<div class="bilan">
  <div class="bilan-net">
    <div class="label">Bilan net</div>
    <div class="value zero" id="netTotal">0,00 €</div>
  </div>
  <div class="bilan-detail">
    <div><div class="k">Billets</div><div class="v" id="totQty">0</div></div>
    <div><div class="k">Achats</div><div class="v" id="totBuy">0 €</div></div>
    <div><div class="k">Ventes</div><div class="v" id="totSell">0 €</div></div>
  </div>
  <div class="bilan-compet" id="competRows"></div>
</div>

<div class="filters" id="filters">
  <button class="chip active" data-f="ALL">Tous</button>
  <button class="chip" data-f="L1">Ligue 1</button>
  <button class="chip" data-f="CE">Coupe d'Europe</button>
  <button class="chip" data-f="CDF">Coupe de France</button>
</div>

<div id="list"></div>

<button class="fab" onclick="openModal()"><span>+</span> Ajouter un match</button>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h2>Ajouter un match</h2>
    <div class="field">
      <label>Compétition</label>
      <select id="mCompet">
        <option value="CE">Coupe d'Europe</option>
        <option value="CDF">Coupe de France</option>
        <option value="L1">Ligue 1 (autre)</option>
      </select>
    </div>
    <div class="field">
      <label>Adversaire</label>
      <input type="text" id="mAdv" placeholder="Ex : Real Madrid">
    </div>
    <div class="field">
      <label>Date (optionnel)</label>
      <input type="text" id="mDate" placeholder="Ex : 03/06/2027">
    </div>
    <p class="hint">Les tours de coupe d'Europe et de Coupe de France seront connus en cours de saison — ajoute-les ici au fur et à mesure.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-ok" onclick="addMatch()">Ajouter</button>
    </div>
  </div>
</div>

<script>
const KEY = 'om_revente_2627_v1';

// 17 matchs à domicile Ligue 1 2026-27 (calendrier LFP du 10 juin 2026)
const SEED = [
  {adv:'Strasbourg', date:'21/08/2026', j:'J1'},
  {adv:'Paris FC',   date:'05/09/2026', j:'J3'},
  {adv:'PSG',        date:'20/09/2026', j:'J5'},
  {adv:'Le Havre',   date:'24/10/2026', j:'J8'},
  {adv:'Toulouse',   date:'31/10/2026', j:'J9'},
  {adv:'Le Mans',    date:'21/11/2026', j:'J11'},
  {adv:'Nice',       date:'05/12/2026', j:'J13'},
  {adv:'Lille',      date:'16/01/2027', j:'J16'},
  {adv:'Troyes',     date:'30/01/2027', j:'J18'},
  {adv:'Angers',     date:'13/02/2027', j:'J20'},
  {adv:'Rennes',     date:'27/02/2027', j:'J22'},
  {adv:'Monaco',     date:'13/03/2027', j:'J24'},
  {adv:'Lyon',       date:'21/03/2027', j:'J25'},
  {adv:'Brest',      date:'10/04/2027', j:'J28'},
  {adv:'Auxerre',    date:'24/04/2027', j:'J30'},
  {adv:'Lens',       date:'16/05/2027', j:'J32'},
  {adv:'Lorient',    date:'29/05/2027', j:'J34'},
];

const COMPET_NAMES = {L1:'Ligue 1', CE:"Coupe d'Europe", CDF:'Coupe de France'};
let data = load();
let filter = 'ALL';

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return SEED.map((m,i)=>({
    id:'l1_'+i, compet:'L1', adv:m.adv, date:m.date, j:m.j,
    qty:'', buy:'', sell:''
  }));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

function fmt(n){
  return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
}
function fmt0(n){
  return n.toLocaleString('fr-FR',{maximumFractionDigits:0})+' €';
}
function net(m){
  const q=parseFloat(m.qty)||0, b=parseFloat(m.buy)||0, s=parseFloat(m.sell)||0;
  return q*(s-b);
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  const shown = data.filter(m => filter==='ALL' || m.compet===filter);

  shown.forEach(m=>{
    const n = net(m);
    const hasData = (parseFloat(m.qty)||0) > 0;
    const card = document.createElement('div');
    card.className = 'card' + (hasData ? (n>=0?' done':' loss') : '');
    const netCls = !hasData ? 'zero' : (n>0?'pos':(n<0?'neg':'zero'));
    const jLabel = m.j ? ' · '+m.j : '';
    const canDel = m.compet !== 'L1' || m.id.startsWith('add_');
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="match-name">OM – ${esc(m.adv)}</div>
          <div class="match-meta">
            <span class="tag ${m.compet}">${COMPET_NAMES[m.compet]}</span>
            <span class="match-date">${esc(m.date||'Date à définir')}${jLabel}</span>
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:4px">
          <div class="card-net ${netCls}">${hasData ? (n>0?'+':'')+fmt(n) : '—'}</div>
          ${canDel ? `<button class="del-btn" onclick="delMatch('${m.id}')">✕</button>` : ''}
        </div>
      </div>
      <div class="inputs">
        <div class="field">
          <label>Nb billets</label>
          <input type="number" inputmode="numeric" min="0" placeholder="0"
            value="${m.qty}" onchange="upd('${m.id}','qty',this.value)">
        </div>
        <div class="field">
          <label>Achat / billet</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0 €"
            value="${m.buy}" onchange="upd('${m.id}','buy',this.value)">
        </div>
        <div class="field">
          <label>Vente / billet</label>
          <input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0 €"
            value="${m.sell}" onchange="upd('${m.id}','sell',this.value)">
        </div>
      </div>`;
    list.appendChild(card);
  });

  // Bilan global
  let totQ=0, totB=0, totS=0;
  const perCompet = {};
  data.forEach(m=>{
    const q=parseFloat(m.qty)||0, b=parseFloat(m.buy)||0, s=parseFloat(m.sell)||0;
    totQ+=q; totB+=q*b; totS+=q*s;
    perCompet[m.compet] = (perCompet[m.compet]||0) + q*(s-b);
  });
  const totalNet = totS-totB;
  const el = document.getElementById('netTotal');
  el.textContent = (totalNet>0?'+':'')+fmt(totalNet);
  el.className = 'value '+(totalNet>0?'pos':(totalNet<0?'neg':'zero'));
  document.getElementById('totQty').textContent = totQ;
  document.getElementById('totBuy').textContent = fmt0(totB);
  document.getElementById('totSell').textContent = fmt0(totS);

  const rows = document.getElementById('competRows');
  rows.innerHTML = '';
  Object.keys(perCompet).forEach(c=>{
    const v = perCompet[c];
    if(Math.abs(v) < 0.005 && c!=='L1') return;
    const cls = v>0?'pos':(v<0?'neg':'zero');
    rows.innerHTML += `<div class="row"><span class="name">${COMPET_NAMES[c]}</span><span class="amt ${cls}">${v>0?'+':''}${fmt(v)}</span></div>`;
  });
}

function esc(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

function upd(id, field, value){
  const m = data.find(x=>x.id===id);
  if(!m) return;
  m[field] = value;
  save(); render();
}

function delMatch(id){
  if(!confirm('Supprimer ce match ?')) return;
  data = data.filter(m=>m.id!==id);
  save(); render();
}

function openModal(){ document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

function addMatch(){
  const adv = document.getElementById('mAdv').value.trim();
  if(!adv){ alert("Indique l'adversaire"); return; }
  data.push({
    id:'add_'+Date.now(),
    compet: document.getElementById('mCompet').value,
    adv, date: document.getElementById('mDate').value.trim(),
    j:'', qty:'', buy:'', sell:''
  });
  document.getElementById('mAdv').value='';
  document.getElementById('mDate').value='';
  save(); closeModal(); render();
}

document.getElementById('filters').addEventListener('click', e=>{
  if(!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c===e.target));
  render();
});

render();
</script>
</body>
</html>
